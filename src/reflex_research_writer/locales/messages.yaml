  finalizing:
    start: "✍️\uFE0F Stesura FINALE..."
    end: "✔️\uFE0F Stesura FINALE completata in {duration:.2f} sec (generati {len_draft} caratteri)"

  evaluating:
    start: "🎯\uFE0F Valutazione FINALE..."
    end: "✔️\uFE0F Valutazione FINALE completata in {duration:.2f} sec (Valutazione: {critique_score}/10)"

  exiting:
